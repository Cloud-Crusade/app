[project]
name = "cc-reservation"
version = "0.1.0"
description = "예약 관리 서비스 (좌석 hold·예매·취소·조회 + gRPC ReservationService)"
requires-python = ">=3.12"
dependencies = [
    "cc-common",
    "cc-config",
    "cc-connector",
    "cc-protos",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["reservation*"]

[tool.uv.sources]
cc-common = { workspace = true }
cc-config = { workspace = true }
cc-connector = { workspace = true }
cc-protos = { workspace = true }

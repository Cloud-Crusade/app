[project]
name = "cc-event"
version = "0.1.0"
description = "행사 관리 서비스 (이벤트 등록·조회·수정·삭제)"
requires-python = ">=3.12"
dependencies = [
    "cc-common",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["event*"]

[tool.uv.sources]
cc-common = { workspace = true }

name: Proto CI

on:
  pull_request:
    paths:
      - "proto/**"
      - "buf.yaml"
      - "buf.gen.yaml"
      - ".github/workflows/proto-ci.yml"

permissions:
  contents: read

jobs:
  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: buf lint
      - run: buf format --diff --exit-code
      - name: breaking
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          # 기준 커밋에 proto 모듈이 있을 때만 비교 (부트스트랩 PR 은 비교 대상 없음)
          if git cat-file -e "$base:buf.yaml" 2>/dev/null; then
            buf breaking --against ".git#format=git,commit=$base"
          else
            echo "기준 커밋에 proto 모듈 없음 — breaking 생략"
          fi

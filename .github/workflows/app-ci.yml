name: App CI

on:
  pull_request:
    branches:
      - main
      - "feature/#44/msa-monorepo"   # MSA 통합 브랜치로 향하는 단계별 PR 도 테스트

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Sync workspace (+dev)
        run: uv sync --extra dev

      - name: Run pytest
        run: uv run pytest
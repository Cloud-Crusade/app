[project]
name = "ticketing"
version = "0.1.0"
description = "티켓팅 서비스 백엔드 (인프라 검증 베드)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "redis>=5.0",
    "aioboto3>=13.0",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "fakeredis>=2.23",
    "aiosqlite>=0.20",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "T20", "SIM", "RUF"]
ignore = ["N802", "N803", "N806"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]  # os.environ.setdefault 가 import 보다 먼저 와야 함

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

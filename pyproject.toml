# MSA 전환(#44): 루트는 가상 워크스페이스 루트. 앱 코드는 services/* · libs/* 에 있다
[tool.uv.workspace]
members = ["services/*", "libs/*"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "fakeredis>=2.23",
    "aiosqlite>=0.20",
    "ruff>=0.5",
    "mypy>=1.10",
    "alembic>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["libs/protos/ccproto", "services/*/alembic/versions"]  # 생성물(스텁·마이그레이션)

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "T20", "SIM", "RUF"]
ignore = ["N802", "N803", "N806"]

[tool.ruff.lint.per-file-ignores]
"**/conftest.py" = ["E402"]  # os.environ.setdefault 가 import 보다 먼저 와야 함

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["services", "libs"]
# 서비스 간 동일 basename(test_service.py) 충돌 방지
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["libs/protos/ccproto", "alembic/versions"]  # 생성물(스텁·마이그레이션)
